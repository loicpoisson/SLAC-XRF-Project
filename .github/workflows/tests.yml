name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      # The beamline data are not in the repository: tests that need them skip,
      # the synthetic ones (incl. the end-to-end cascade) run.
      - run: python -m pytest -q tests
        env:
          MPLBACKEND: Agg
